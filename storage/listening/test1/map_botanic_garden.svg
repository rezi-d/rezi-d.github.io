<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%" class="rounded-2xl border border-slate-200 shadow-sm bg-emerald-50/40 font-sans">
  <defs>
    <pattern id="grass" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f0fdf4"/>
      <circle cx="2" cy="2" r="1" fill="#bbf7d0" opacity="0.6"/>
      <circle cx="12" cy="12" r="1.2" fill="#bbf7d0" opacity="0.6"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="800" height="560" fill="url(#grass)"/>

  <!-- Compass Rose -->
  <g transform="translate(730, 60)" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <path d="M 0 -22 L 5 0 L 0 4 L -5 0 Z" fill="#0284c7"/>
    <path d="M 0 22 L 4 0 L 0 -4 L -4 0 Z" fill="#94a3b8"/>
    <path d="M 22 0 L 0 4 L -4 0 L 0 -4 Z" fill="#94a3b8"/>
    <path d="M -22 0 L 0 -4 L 4 0 L 0 4 Z" fill="#94a3b8"/>
    <text x="0" y="-10" fill="#0284c7">N</text>
    <text x="0" y="19" fill="#64748b">S</text>
    <text x="17" y="4" fill="#64748b">E</text>
    <text x="-17" y="4" fill="#64748b">W</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 30)">
    <rect width="320" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" fill="#065f46">
      🌿 City Botanical Garden &amp; Arboretum Plan
    </text>
  </g>

  <!-- Boundary & River on the West -->
  <path d="M 40 0 Q 70 200 45 380 Q 25 480 35 560" fill="none" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" opacity="0.7"/>
  <text x="18" y="280" font-size="10" font-weight="700" fill="#0284c7" transform="rotate(-90 18 280)" letter-spacing="2">WESTERN STREAM</text>

  <!-- Pathways (Gravel) -->
  <!-- Main Entrance Avenue -->
  <path d="M 400 550 L 400 320" stroke="#fde68a" stroke-width="32" stroke-linecap="round"/>
  <path d="M 400 550 L 400 320" stroke="#d97706" stroke-width="2" stroke-dasharray="6,6" fill="none"/>

  <!-- Central Circular Plaza -->
  <circle cx="400" cy="270" r="55" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="400" cy="270" r="22" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="274" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">Central Fountain</text>

  <!-- Pathway North to Lake -->
  <path d="M 400 215 L 400 90" stroke="#fde68a" stroke-width="24" stroke-linecap="round"/>
  <!-- Pathway West to Stream & Lookout -->
  <path d="M 345 270 L 140 270 L 140 200" stroke="#fde68a" stroke-width="22" stroke-linejoin="round" fill="none"/>
  <!-- Pathway North-West to Ferns -->
  <path d="M 360 230 L 220 130" stroke="#fde68a" stroke-width="20" stroke-linecap="round"/>
  <!-- Pathway East to Rose Garden & Herbs -->
  <path d="M 455 270 L 660 270" stroke="#fde68a" stroke-width="22" stroke-linecap="round"/>
  <!-- Pathway North-East to Herbs -->
  <path d="M 440 230 L 590 130" stroke="#fde68a" stroke-width="20" stroke-linecap="round"/>
  <!-- Pathway South-East to Orchids -->
  <path d="M 416 380 L 580 430" stroke="#fde68a" stroke-width="20" stroke-linecap="round"/>
  <!-- Pathway South-West to Info -->
  <path d="M 384 410 L 250 450" stroke="#fde68a" stroke-width="20" stroke-linecap="round"/>

  <!-- Main Entrance -->
  <g transform="translate(400, 520)">
    <rect x="-85" y="-12" width="170" height="34" rx="8" fill="#1e293b" filter="url(#shadow)"/>
    <text x="0" y="10" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">MAIN ENTRANCE ⬇</text>
    <text x="0" y="32" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">You are here</text>
  </g>

  <!-- ================= PIN A ================= -->
  <!-- Location: North-West Corner (Tropical Fern Pavilion) -->
  <g transform="translate(180, 110)">
    <rect x="-55" y="-35" width="110" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Pavilion Area</text>
    <circle cx="0" cy="18" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="23" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">A</text>
  </g>

  <!-- ================= PIN B ================= -->
  <!-- Location: West Riverwalk Lookout -->
  <g transform="translate(140, 240)">
    <rect x="-50" y="-30" width="100" height="60" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" font-size="10" font-weight="700" fill="#0369a1" text-anchor="middle">Riverside Deck</text>
    <circle cx="0" cy="16" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="21" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- ================= PIN C ================= -->
  <!-- Location: South-West Corner (Visitor Amenities) -->
  <g transform="translate(220, 440)">
    <rect x="-50" y="-30" width="100" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">South Facility</text>
    <circle cx="0" cy="16" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="21" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
  </g>

  <!-- ================= PIN D ================= -->
  <!-- Location: North-East Corner (Nursery & Research) -->
  <g transform="translate(620, 110)">
    <rect x="-55" y="-35" width="110" height="70" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" font-size="10" font-weight="700" fill="#854d0e" text-anchor="middle">North Plots</text>
    <circle cx="0" cy="18" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="23" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">D</text>
  </g>

  <!-- ================= PIN E ================= -->
  <!-- Location: East Lawns -->
  <g transform="translate(680, 270)">
    <rect x="-50" y="-30" width="100" height="60" rx="10" fill="#fdf2f8" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" font-size="10" font-weight="700" fill="#be123c" text-anchor="middle">East Grounds</text>
    <circle cx="0" cy="16" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="21" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">E</text>
  </g>

  <!-- ================= PIN F ================= -->
  <!-- Location: South-East Glasshouse -->
  <g transform="translate(610, 440)">
    <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-8" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">Glasshouse Annex</text>
    <circle cx="0" cy="16" r="16" fill="#0284c7" stroke="#ffffff" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="21" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">F</text>
  </g>
</svg>
