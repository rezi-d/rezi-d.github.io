    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Koleksi lengkap 23 soal resmi TKA Kimia SMA 2025 beserta kunci jawaban dan pembahasan ilmiah mendalam step-by-step.">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="📖 Bank Soal &amp; Pembahasan Lengkap TKA Kimia SMA 2025">
    <meta property="og:description" content="Pelajari 23 butir soal TKA Kimia SMA 2025 lengkap dengan hierarki indikator, konsep dasar, dan pembahasan langkah demi langkah.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- HEADER (dimuat otomatis) -->
    <div id="header-placeholder"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <!-- HEADER NAVIGASI MODUL -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8 pb-6 border-b border-slate-200">
            <div>
                <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-semibold uppercase mb-2">
                    Bank Soal &amp; Pembahasan
                </span>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">
                    📖 Soal &amp; Pembahasan TKA Kimia SMA 2025
                </h1>
                <p class="text-sm text-slate-600 mt-1">
                    23 Butir Soal Resmi Pilihan TKA 2025 dengan analisis konsep dan kunci jawaban terverifikasi.
                </p>
            </div>
            <div class="flex items-center gap-2">
                <a href="/tka/index.html" class="inline-flex items-center gap-2 px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold text-xs rounded-xl shadow-xs transition">
                    <span>⏱️ Ke Mode Simulasi Ujian</span> &rarr;
                </a>
            </div>
        </div>

        <!-- FILTER & PENCARIAN SOAL -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs mb-8 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2 text-xs">
                <span class="font-semibold text-slate-700">Filter Elemen:</span>
                <select id="filter-elemen" class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 font-medium text-slate-800 focus:outline-teal-500">
                    <option value="all">Semua Elemen (23 Soal)</option>
                    <option value="Kimia Dasar">Kimia Dasar (Stoikiometri)</option>
                    <option value="Kimia Organik">Kimia Organik (Hidrokarbon)</option>
                    <option value="Kimia Analitik">Kimia Analitik (Larutan &amp; Koligatif)</option>
                    <option value="Kimia Fisik">Kimia Fisik (Dinamika &amp; Elektrokimia)</option>
                </select>
            </div>
            <div class="text-xs text-slate-500 font-medium" id="total-count-label">
                Menampilkan 23 Butir Soal
            </div>
        </div>

        <!-- DAFTAR KARTU SOAL & PEMBAHASAN -->
        <div id="soal-list-container" class="space-y-8"></div>
    </main>

    <!-- FOOTER & SPU MODAL (dimuat otomatis) -->
    <div id="footer-placeholder"></div>
    <div id="spu-placeholder"></div>

    <script src="/js/curriculum.js"></script>
    <script src="/js/spu.js"></script>
    <script src="/js/include.js"></script>
    <script src="/tka/js/tka-data.js"></script>

    <script>
        function renderPembahasan(filter = "all") {
            const container = document.getElementById('soal-list-container');
            const filtered = filter === "all" ? tkaData : tkaData.filter(d => d.elemen === filter);
            document.getElementById('total-count-label').innerText = `Menampilkan ${filtered.length} Butir Soal`;

            container.innerHTML = filtered.map((item, index) => {
                let badgeTipe = item.tipe === 'pg' 
                    ? '<span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded text-[11px] font-semibold">Pilihan Ganda</span>'
                    : (item.tipe === 'mcma' 
                        ? '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-[11px] font-semibold">Pilihan Ganda Kompleks (Centang Banyak)</span>'
                        : '<span class="px-2 py-0.5 bg-purple-100 text-purple-800 rounded text-[11px] font-semibold">Pilihan Ganda Kompleks (Benar / Salah)</span>');

                let kunciTampilan = '';
                if (item.tipe === 'pg') {
                    const opt = item.options.find(o => o.id === item.kunci);
                    kunciTampilan = `<span class="font-bold text-emerald-800 bg-emerald-100 px-2.5 py-1 rounded text-xs">Kunci: ${item.kunci}. ${opt ? opt.text : ''}</span>`;
                } else if (item.tipe === 'mcma') {
                    kunciTampilan = `<span class="font-bold text-emerald-800 bg-emerald-100 px-2.5 py-1 rounded text-xs">Kunci Jawaban Benar: ${item.kunci.join(', ')}</span>`;
                } else if (item.tipe === 'kompleks_bs') {
                    kunciTampilan = item.items.map((it, idx) => `
                        <div class="text-xs bg-slate-50 p-2 rounded border border-slate-200 mt-1">
                            <strong>Pernyataan ${idx + 1}:</strong> <span class="font-semibold text-emerald-700 font-mono">[${it.kunci.toUpperCase()}]</span> &mdash; ${it.pernyataan}
                        </div>
                    `).join('');
                }

                return `
                    <article class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden" id="soal-${item.id}">
                        <!-- HEADER KARTU SOAL -->
                        <div class="bg-slate-50/80 px-6 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="w-7 h-7 rounded-full bg-teal-600 text-white font-bold text-xs flex items-center justify-center">
                                    ${item.id}
                                </span>
                                <span class="font-bold text-slate-800 text-sm">Soal No. ${item.id}</span>
                                ${badgeTipe}
                            </div>
                            <span class="text-[11px] font-mono text-slate-400">${item.kode}</span>
                        </div>

                        <!-- BODY SOAL (GAMBAR ASLI) -->
                        <div class="p-6">
                            <div class="mb-4">
                                <img src="${item.img}" alt="Soal ${item.id} TKA Kimia 2025" class="w-full max-w-4xl mx-auto rounded-xl border border-slate-200 shadow-xs bg-white" loading="lazy">
                            </div>

                            <!-- TOMBOL TOGGLE PEMBAHASAN -->
                            <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2">
                                <button class="btn-toggle-pembahasan px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs rounded-xl transition flex items-center gap-1.5" data-target="box-pembahasan-${item.id}">
                                    <span>💡 Lihat Kunci &amp; Pembahasan</span>
                                    <span class="arrow-icon">&darr;</span>
                                </button>
                                <div>${item.tipe !== 'kompleks_bs' ? kunciTampilan : ''}</div>
                            </div>

                            <!-- BOX PEMBAHASAN RINCI (AWALNYA TERSEMBUNYI) -->
                            <div id="box-pembahasan-${item.id}" class="hidden mt-4 p-5 bg-teal-50/40 rounded-xl border border-teal-200 text-xs text-slate-700 leading-relaxed space-y-3">
                                ${item.tipe === 'kompleks_bs' ? `<div class="mb-3"><strong>Kunci Tiap Pernyataan:</strong>${kunciTampilan}</div>` : ''}
                                <div>${item.pembahasan}</div>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');

            // Pasang event listener toggle pembahasan
            document.querySelectorAll('.btn-toggle-pembahasan').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetId = btn.dataset.target;
                    const box = document.getElementById(targetId);
                    const arrow = btn.querySelector('.arrow-icon');
                    if (box.classList.contains('hidden')) {
                        box.classList.remove('hidden');
                        btn.classList.add('bg-teal-100', 'text-teal-900');
                        btn.querySelector('span').innerText = 'Tutup Pembahasan';
                        arrow.innerHTML = '&uarr;';
                    } else {
                        box.classList.add('hidden');
                        btn.classList.remove('bg-teal-100', 'text-teal-900');
                        btn.querySelector('span').innerText = '💡 Lihat Kunci & Pembahasan';
                        arrow.innerHTML = '&darr;';
                    }
                });
            });
        }

        document.getElementById('filter-elemen').addEventListener('change', (e) => {
            renderPembahasan(e.target.value);
        });

        // Inisialisasi awal
        renderPembahasan();
    </script>
</body>
</html>
