<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Membaca Artikel - Sains Populer | KimiaInteraktif</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex-grow w-full">
        <!-- BREADCRUMBS -->
        <nav class="flex items-center gap-2 text-xs text-slate-500 mb-6 flex-wrap">
            <a href="/index.html" class="hover:text-teal-600 transition">Beranda</a>
            <span>/</span>
            <a href="/sains-populer/index.html" class="hover:text-teal-600 transition">Sains Populer</a>
            <span>/</span>
            <span id="breadcrumb-title" class="text-slate-800 font-semibold truncate max-w-[200px] sm:max-w-md">Artikel</span>
        </nav>

        <!-- CONTAINER ARTIKEL UTAMA -->
        <article id="article-container" class="bg-white rounded-3xl border border-black/[0.06] shadow-[0_8px_32px_rgba(0,0,0,0.03)] p-6 sm:p-10 md:p-12 mb-12">
            <!-- Article Header & Content injected here -->
        </article>

        <!-- NOT FOUND STATE -->
        <div id="not-found-container" class="hidden text-center py-16 bg-white rounded-3xl border border-dashed border-slate-200">
            <span class="text-5xl">📄</span>
            <h2 class="text-xl font-bold text-slate-900 mt-4">Artikel Tidak Ditemukan</h2>
            <p class="text-sm text-slate-500 mt-2 max-w-md mx-auto">
                Maaf, artikel yang kamu cari tidak tersedia atau tautan yang kamu buka salah.
            </p>
            <a href="/sains-populer/index.html" class="mt-6 inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-teal-600 text-white text-xs font-bold hover:bg-teal-700 transition">
                <span>&larr;</span>
                <span>Kembali ke Sains Populer</span>
            </a>
        </div>

        <!-- REKOMENDASI ARTIKEL LAINNYA -->
        <div id="rekomendasi-container" class="mt-12 pt-8 border-t border-slate-200">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Ulasan Sains Populer Lainnya</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Jelajahi topik sains dan teknologi menarik lainnya</p>
                </div>
                <a href="/sains-populer/index.html" class="text-xs font-bold text-teal-600 hover:text-teal-700 flex items-center gap-1">
                    <span>Lihat Semua</span>
                    <span>&rsaquo;</span>
                </a>
            </div>
            <div id="rekomendasi-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-2">
            <span>✅</span>
            <span id="toast-text">Tautan artikel berhasil disalin!</span>
        </div>
    </div>

    <!-- Footer & SPU Placeholders -->
    <div id="footer-placeholder"></div>
    <div id="spu-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/curriculum.js"></script>
    <script src="/js/spu.js"></script>
    <script src="/js/include.js"></script>
    <script src="/sains-populer/data/artikel.js"></script>
    <script>
        function tampilkanToast(pesan) {
            const toast = document.getElementById('toast');
            const text = document.getElementById('toast-text');
            text.innerText = pesan;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function salinTautan() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                tampilkanToast('Tautan artikel berhasil disalin!');
            }).catch(() => {
                tampilkanToast('Gagal menyalin tautan.');
            });
        }

        function loadArtikel() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('id');

            const container = document.getElementById('article-container');
            const notFound = document.getElementById('not-found-container');
            const breadcrumbTitle = document.getElementById('breadcrumb-title');

            if (!slug || typeof DAFTAR_ARTIKEL_SAINS === 'undefined') {
                container.classList.add('hidden');
                notFound.classList.remove('hidden');
                return;
            }

            const art = DAFTAR_ARTIKEL_SAINS.find(item => item.slug === slug || item.id === slug);

            if (!art) {
                container.classList.add('hidden');
                notFound.classList.remove('hidden');
                return;
            }

            // Update title
            document.title = `${art.title} - Sains Populer | KimiaInteraktif`;
            breadcrumbTitle.innerText = art.title;

            // Render Kaitan Materi SMA
            const kaitanMateriHtml = (art.kaitanMateri || []).map(k => `
                <div class="p-4 rounded-2xl bg-white border border-teal-100/80 shadow-2xs hover:shadow-sm transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[11px] font-bold text-teal-800 bg-teal-50 px-2 py-0.5 rounded-full border border-teal-200">
                                ${k.kelas}
                            </span>
                            <span class="text-xs text-slate-400">Kimia SMA</span>
                        </div>
                        <h5 class="text-sm font-bold text-slate-900 mt-1 mb-1">${k.bab}</h5>
                        <p class="text-xs text-slate-600 leading-relaxed mb-3">${k.desc}</p>
                    </div>
                    <div>
                        <a href="${k.url}" class="inline-flex items-center gap-1.5 text-xs font-bold text-teal-600 hover:text-teal-700">
                            <span>Buka Bab Materi</span>
                            <span class="text-sm leading-none">&rarr;</span>
                        </a>
                    </div>
                </div>
            `).join('');

            // Render Header & Body
            container.innerHTML = `
                <!-- Top Meta Bar -->
                <div class="flex flex-wrap items-center justify-between gap-3 pb-6 border-b border-slate-100 mb-6">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full ${
                            art.categoryColor === 'amber' ? 'bg-amber-100 text-amber-900' :
                            art.categoryColor === 'teal' ? 'bg-teal-100 text-teal-900' :
                            'bg-indigo-100 text-indigo-900'
                        }">
                            ${art.category}
                        </span>
                        <span class="text-xs text-slate-400">•</span>
                        <span class="text-xs text-slate-500 flex items-center gap-1">
                            <span>⏱️</span> ${art.readTime}
                        </span>
                    </div>

                    <div class="flex items-center gap-2">
                        <button type="button" onclick="salinTautan()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition cursor-pointer">
                            <span>🔗</span>
                            <span>Salin Tautan</span>
                        </button>
                        <a href="https://wa.me/?text=${encodeURIComponent(art.title + ' - Baca di: ' + window.location.href)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold border border-emerald-200 transition">
                            <span>💬</span>
                            <span>Bagikan</span>
                        </a>
                    </div>
                </div>

                <!-- Judul & Subjudul -->
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">
                    ${art.title}
                </h1>
                <p class="text-sm sm:text-base text-slate-500 font-normal leading-relaxed mb-6">
                    ${art.subtitle}
                </p>

                <!-- Penulis & Tanggal -->
                <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-slate-50 border border-slate-100 mb-8 text-xs text-slate-600">
                    <span class="w-8 h-8 rounded-full bg-teal-600 text-white flex items-center justify-center font-bold text-sm select-none">
                        🧪
                    </span>
                    <div>
                        <p class="font-bold text-slate-800">${art.author}</p>
                        <p class="text-[11px] text-slate-400">Ditinjau secara ilmiah • Dipublikasikan ${art.publishDate}</p>
                    </div>
                </div>

                <!-- Konten Utama Artikel -->
                <div class="text-slate-700 leading-relaxed space-y-4 text-sm sm:text-base">
                    ${art.contentHtml}
                </div>

                <!-- TAHUKAH KAMU BOX -->
                ${art.tahukahKamu ? `
                    <div class="mt-10 p-6 rounded-3xl bg-gradient-to-br from-amber-50/80 via-orange-50/40 to-yellow-50/80 border border-amber-200/80">
                        <div class="flex items-start gap-3.5">
                            <span class="text-3xl select-none">💡</span>
                            <div>
                                <h4 class="font-bold text-amber-950 text-base mb-1.5">Tahukah Kamu?</h4>
                                <p class="text-xs sm:text-sm text-amber-900/90 leading-relaxed">
                                    ${art.tahukahKamu}
                                </p>
                            </div>
                        </div>
                    </div>
                ` : ''}

                <!-- KAITAN MATERI KURIKULUM SMA BOX -->
                <div class="mt-10 p-6 sm:p-8 rounded-3xl bg-gradient-to-br from-teal-50/70 via-slate-50 to-emerald-50/60 border border-teal-200/70">
                    <div class="flex items-center gap-2.5 mb-2">
                        <span class="text-2xl select-none">🧪</span>
                        <h4 class="font-bold text-slate-900 text-base sm:text-lg">Kacamata Kimia SMA: Hubungkan dengan Pelajaranmu!</h4>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-6">
                        Konsep sains dalam artikel ini berkaitan langsung dengan materi yang kamu pelajari di sekolah. Klik untuk mendalami rumusan dan latihan soalnya:
                    </p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                        ${kaitanMateriHtml}
                    </div>
                </div>

                <!-- RUANG DISKUSI & UJI NALAR + KOLOM KOMENTAR SISWA -->
                <div class="mt-8 rounded-3xl bg-gradient-to-br from-indigo-50/70 via-white to-slate-50 border border-indigo-200/80 shadow-xs overflow-hidden">
                    ${art.diskusi ? `
                        <div class="p-6 sm:p-7 bg-indigo-50/70 border-b border-indigo-100">
                            <div class="flex items-start gap-3.5">
                                <span class="text-2xl sm:text-3xl select-none">🤔</span>
                                <div>
                                    <span class="inline-block text-[11px] font-bold uppercase tracking-wider text-indigo-600 bg-indigo-100/80 px-2.5 py-0.5 rounded-full mb-1.5">Pemantik Diskusi Ilmiah</span>
                                    <h4 class="font-bold text-indigo-950 text-base sm:text-lg mb-1.5">Ruang Diskusi &amp; Uji Nalar Sains</h4>
                                    <p class="text-xs sm:text-sm text-indigo-900/90 leading-relaxed">
                                        ${art.diskusi}
                                    </p>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- Form & Daftar Komentar Siswa -->
                    <div class="p-6 sm:p-8" id="forum-diskusi-section">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-5">
                            <div class="flex items-center gap-2.5">
                                <span class="text-xl select-none">💬</span>
                                <h4 class="font-bold text-slate-900 text-base sm:text-lg">Tanggapan &amp; Diskusi Siswa</h4>
                                <span id="comment-count-badge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700">0</span>
                            </div>
                            <button type="button" id="btn-toggle-admin" onclick="toggleAdminMode()" class="text-[11px] font-semibold px-3 py-1 rounded-full border border-slate-200 text-slate-500 hover:text-indigo-700 hover:border-indigo-200 transition cursor-pointer">
                                🔑 Mode Guru
                            </button>
                        </div>

                        <!-- Banner Status Mode Guru -->
                        <div id="admin-mode-banner" class="hidden mb-4 p-3 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-between text-xs text-emerald-900">
                            <div class="flex items-center gap-2">
                                <span>👨‍🏫</span>
                                <span><strong>Mode Guru / Admin Aktif:</strong> Komentar Anda akan ditandai lencana <b>Guru / Admin</b> dan Anda dapat menghapus komentar spam.</span>
                            </div>
                            <button type="button" onclick="logoutAdminMode()" class="text-emerald-700 hover:text-emerald-950 font-bold underline ml-3 cursor-pointer">Keluar</button>
                        </div>

                        <!-- Form Kirim Komentar -->
                        <form id="comment-form" onsubmit="submitArticleComment(event)" class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/90 shadow-2xs mb-6">
                            <!-- Indikator Membalas Komentar -->
                            <div id="reply-indicator" class="hidden mb-3 px-3.5 py-2 rounded-xl bg-indigo-50 border border-indigo-200 flex items-center justify-between text-xs text-indigo-900">
                                <span id="reply-indicator-text" class="font-semibold">Membalas komentar...</span>
                                <button type="button" onclick="cancelReplyComment()" class="text-indigo-600 hover:text-indigo-900 font-bold cursor-pointer">✕ Batal</button>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                                <div>
                                    <label for="comment-name" class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap <span class="text-rose-500">*</span></label>
                                    <input type="text" id="comment-name" required maxlength="50" placeholder="Contoh: Nadia Putri" class="w-full px-3.5 py-2 text-xs sm:text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition" />
                                </div>
                                <div>
                                    <label for="comment-school" class="block text-xs font-bold text-slate-700 mb-1">Kelas / Asal Sekolah <span class="text-slate-400 font-normal">(Opsional)</span></label>
                                    <input type="text" id="comment-school" maxlength="60" placeholder="Contoh: XI F1 - SMAN 1 Padang" class="w-full px-3.5 py-2 text-xs sm:text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition" />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="comment-content" class="block text-xs font-bold text-slate-700 mb-1">Pendapat / Jawaban Uji Nalar <span class="text-rose-500">*</span></label>
                                <textarea id="comment-content" required rows="3" maxlength="1000" placeholder="Tuliskan analisis ilmiahmu, jawaban dari pertanyaan di atas, atau pertanyaan yang ingin kamu diskusikan..." class="w-full px-3.5 py-2.5 text-xs sm:text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition resize-y"></textarea>
                                <div class="flex items-center justify-between mt-1 text-[11px] text-slate-400">
                                    <span>Gunakan bahasa yang santun dan ilmiah (tanpa tautan/link luar).</span>
                                    <span id="comment-char-info">Maks. 1000 karakter</span>
                                </div>
                            </div>

                            <div id="comment-alert" class="hidden mb-3 p-3 rounded-xl text-xs font-medium"></div>

                            <div class="flex items-center justify-end">
                                <button type="submit" id="comment-submit-btn" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs sm:text-sm font-bold shadow-xs transition cursor-pointer">
                                    <span>🚀 Kirim Tanggapan</span>
                                </button>
                            </div>
                        </form>

                        <!-- Daftar Komentar -->
                        <div id="comments-list" class="space-y-4">
                            <div class="text-center py-6 text-xs text-slate-400">Memuat diskusi siswa...</div>
                        </div>
                    </div>
                </div>

                <!-- TOMBOL KEMBALI DI BAWAH -->
                <div class="mt-12 pt-6 border-t border-slate-100 flex items-center justify-between">
                    <a href="/sains-populer/index.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                        <span>&larr;</span>
                        <span>Daftar Artikel Sains Populer</span>
                    </a>
                    <button type="button" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-400 hover:text-slate-700 transition cursor-pointer">
                        <span>Ke Atas</span>
                        <span>&uarr;</span>
                    </button>
                </div>
            `;

            // Inisialisasi Forum Diskusi Siswa untuk artikel ini
            initCommentSystem(art.slug);

            // Render Rekomendasi Artikel Lain
            const rekomendasi = DAFTAR_ARTIKEL_SAINS.filter(item => item.slug !== art.slug);
            const rekGrid = document.getElementById('rekomendasi-grid');
            if (rekGrid && rekomendasi.length > 0) {
                rekGrid.innerHTML = rekomendasi.slice(0, 2).map(r => `
                    <a href="/sains-populer/baca.html?id=${r.slug}" class="block p-5 rounded-2xl bg-white border border-slate-200/80 shadow-2xs hover:shadow-md hover:border-teal-300 transition group">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded-full ${
                                r.categoryColor === 'amber' ? 'bg-amber-100 text-amber-800' :
                                r.categoryColor === 'teal' ? 'bg-teal-100 text-teal-800' :
                                'bg-indigo-100 text-indigo-800'
                            }">
                                ${r.category}
                            </span>
                            <span class="text-[11px] text-slate-400">${r.readTime}</span>
                        </div>
                        <h4 class="text-sm font-bold text-slate-900 group-hover:text-teal-600 transition line-clamp-2 mb-1.5">
                            ${r.title}
                        </h4>
                        <p class="text-xs text-slate-500 line-clamp-2">
                            ${r.summary}
                        </p>
                    </a>
                `).join('');
            }
        }

        // ============================================================
        // SISTEM KOMENTAR & DISKUSI SISWA (CLOUDFLARE WORKER + D1)
        // ============================================================
        const COMMENTS_API_BASE = 'https://kimia-snbt-api.kimia-ajarkita.workers.dev';
        let currentArticleSlug = '';
        let currentReplyParentId = null;
        let currentReplyParentName = '';
        let cachedComments = [];
        let likedCommentIds = [];

        function getDeviceId() {
            let devId = localStorage.getItem('kimia_device_id');
            if (!devId) {
                devId = 'dev_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now().toString(36);
                localStorage.setItem('kimia_device_id', devId);
            }
            return devId;
        }

        function escapeHtmlText(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatWaktuRelatif(ts) {
            if (!ts) return 'Baru saja';
            const diffSec = Math.max(0, Math.floor((Date.now() - Number(ts)) / 1000));
            if (diffSec < 60) return 'Baru saja';
            const diffMin = Math.floor(diffSec / 60);
            if (diffMin < 60) return diffMin + ' menit lalu';
            const diffHour = Math.floor(diffMin / 60);
            if (diffHour < 24) return diffHour + ' jam lalu';
            const diffDay = Math.floor(diffHour / 24);
            if (diffDay < 30) return diffDay + ' hari lalu';
            const d = new Date(Number(ts));
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function getInitials(name) {
            const parts = String(name || 'S').trim().split(/\s+/);
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return (parts[0].substring(0, 2) || 'SI').toUpperCase();
        }

        function hasClientProfanityOrLink(text) {
            const lower = String(text || '').toLowerCase();
            if (/https?:\/\/|www\.|[a-z0-9-]+\.(com|net|org|xyz|slot|vip|bet|link)\b/i.test(lower)) {
                return 'Tautan/link eksternal tidak diperbolehkan di kolom diskusi.';
            }
            const bad = [
                'anjing', 'anjir', 'anjrit', 'bangsat', 'bgst', 'babi', 'monyet', 'kunyuk',
                'bajingan', 'asu', 'kampret', 'keparat', 'brengsek', 'goblog', 'goblok',
                'tolol', 'idiot', 'bego', 'begok', 'sinting', 'sarap', 'kontol', 'memek',
                'jembut', 'ngentot', 'entot', 'peju', 'pelacur', 'lonte', 'perek', 'jablay',
                'bokep', 'porno', 'jancok', 'jancuk', 'cuk', 'cok', 'pantek', 'puki',
                'kimak', 'sialan', 'tai', 'taik', 'setan', 'iblis', 'laknat',
                'gacor', 'maxwin', 'slot88', 'judol', 'togel', 'casino', 'sbobet', 'zeus88'
            ];
            for (const w of bad) {
                const re = new RegExp('(^|[^a-z0-9])' + w + '([^a-z0-9]|$)', 'i');
                if (re.test(lower)) {
                    return 'Mohon gunakan bahasa yang santun dan ilmiah (terdeteksi kata yang tidak pantas).';
                }
            }
            return null;
        }

        function initCommentSystem(slug) {
            currentArticleSlug = slug;
            currentReplyParentId = null;

            // Isi otomatis nama & sekolah dari simpanan lokal jika pernah mengisi
            const savedName = localStorage.getItem('kimia_comment_name') || '';
            const savedSchool = localStorage.getItem('kimia_comment_school') || '';
            const nameInput = document.getElementById('comment-name');
            const schoolInput = document.getElementById('comment-school');
            if (nameInput && savedName) nameInput.value = savedName;
            if (schoolInput && savedSchool) schoolInput.value = savedSchool;

            // Karakter counter
            const contentInput = document.getElementById('comment-content');
            const charInfo = document.getElementById('comment-char-info');
            if (contentInput && charInfo) {
                contentInput.addEventListener('input', () => {
                    charInfo.textContent = contentInput.value.length + ' / 1000 karakter';
                });
            }

            // Sinkronisasi tampilan Mode Guru
            updateAdminUI();

            // Muat daftar komentar
            fetchArticleComments();
        }

        function updateAdminUI() {
            const adminKey = localStorage.getItem('kimia_admin_key');
            const banner = document.getElementById('admin-mode-banner');
            const btn = document.getElementById('btn-toggle-admin');
            if (adminKey) {
                if (banner) banner.classList.remove('hidden');
                if (btn) {
                    btn.innerHTML = '👨‍🏫 Mode Guru Aktif';
                    btn.className = 'text-[11px] font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300 cursor-pointer';
                }
            } else {
                if (banner) banner.classList.add('hidden');
                if (btn) {
                    btn.innerHTML = '🔑 Mode Guru';
                    btn.className = 'text-[11px] font-semibold px-3 py-1 rounded-full border border-slate-200 text-slate-500 hover:text-indigo-700 hover:border-indigo-200 transition cursor-pointer';
                }
            }
        }

        function toggleAdminMode() {
            const existing = localStorage.getItem('kimia_admin_key');
            if (existing) {
                logoutAdminMode();
                return;
            }
            const inputKey = window.prompt('Masukkan Kode Guru Diskusi untuk mengaktifkan lencana Guru & fitur moderasi komentar:');
            if (inputKey && inputKey.trim()) {
                localStorage.setItem('kimia_admin_key', inputKey.trim());
                updateAdminUI();
                renderCommentsList();
            }
        }

        function logoutAdminMode() {
            localStorage.removeItem('kimia_admin_key');
            updateAdminUI();
            renderCommentsList();
        }

        function showCommentAlert(msg, isError = true) {
            const alertBox = document.getElementById('comment-alert');
            if (!alertBox) return;
            alertBox.className = 'mb-3 p-3 rounded-xl text-xs font-medium ' + (
                isError
                    ? 'bg-rose-50 text-rose-700 border border-rose-200'
                    : 'bg-emerald-50 text-emerald-800 border border-emerald-200'
            );
            alertBox.textContent = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 5000);
        }

        function getLocalFallbackComments(slug) {
            try {
                return JSON.parse(localStorage.getItem('kimia_local_comments_' + slug) || '[]');
            } catch (e) {
                return [];
            }
        }

        function saveLocalFallbackComments(slug, list) {
            try {
                localStorage.setItem('kimia_local_comments_' + slug, JSON.stringify(list));
            } catch (e) {}
        }

        async function fetchArticleComments() {
            const deviceId = getDeviceId();
            try {
                const res = await fetch(
                    COMMENTS_API_BASE + '/comments/' + encodeURIComponent(currentArticleSlug) + '?deviceId=' + encodeURIComponent(deviceId)
                );
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                if (data && data.ok) {
                    cachedComments = data.comments || [];
                    likedCommentIds = data.likedIds || [];
                    saveLocalFallbackComments(currentArticleSlug, cachedComments);
                    renderCommentsList();
                    return;
                }
            } catch (err) {
                // Fallback ke simpanan lokal jika Worker belum terjangkau
                cachedComments = getLocalFallbackComments(currentArticleSlug);
            }
            renderCommentsList();
        }

        function renderSingleCommentItem(c, isReply = false, isAdminActive = false) {
            const isLiked = likedCommentIds.includes(c.id);
            const isGuru = Number(c.is_admin) === 1;
            const avatarClass = isGuru
                ? 'bg-gradient-to-br from-emerald-600 to-teal-700 text-white'
                : 'bg-gradient-to-br from-indigo-100 to-slate-200 text-indigo-900';

            return `
                <div class="${isReply ? 'ml-7 sm:ml-11 mt-3 pl-4 border-l-2 border-indigo-100' : 'p-4 sm:p-5 rounded-2xl bg-white border border-slate-200/80 shadow-2xs'}">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full ${avatarClass} flex items-center justify-center text-xs font-extrabold shrink-0 select-none">
                            ${isGuru ? '👨‍🏫' : escapeHtmlText(getInitials(c.author_name))}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex flex-wrap items-center gap-1.5 mb-1">
                                <span class="font-bold text-slate-900 text-xs sm:text-sm">${escapeHtmlText(c.author_name)}</span>
                                ${isGuru ? `
                                    <span class="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">
                                        ✓ Guru / Admin
                                    </span>
                                ` : ''}
                                ${c.school_name ? `
                                    <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
                                        🏫 ${escapeHtmlText(c.school_name)}
                                    </span>
                                ` : ''}
                                <span class="text-[11px] text-slate-400">&bull; ${formatWaktuRelatif(c.created_at)}</span>
                            </div>

                            <p class="text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line break-words mb-2.5">${escapeHtmlText(c.content)}</p>

                            <div class="flex flex-wrap items-center gap-4 text-xs">
                                <button type="button" onclick="toggleLikeComment(${Number(c.id)})" class="inline-flex items-center gap-1.5 font-semibold transition cursor-pointer ${
                                    isLiked ? 'text-indigo-600' : 'text-slate-400 hover:text-indigo-600'
                                }">
                                    <span>👍</span>
                                    <span>Menarik</span>
                                    ${Number(c.likes) > 0 ? `<span class="px-1.5 py-0.2 rounded-full bg-indigo-50 text-indigo-700 text-[11px] font-bold">${Number(c.likes)}</span>` : ''}
                                </button>

                                ${!isReply ? `
                                    <button type="button" onclick="setReplyComment(${Number(c.id)}, '${escapeHtmlText(c.author_name).replace(/'/g, "\\'")}')" class="inline-flex items-center gap-1 font-semibold text-slate-400 hover:text-indigo-600 transition cursor-pointer">
                                        <span>💬</span>
                                        <span>Balas</span>
                                    </button>
                                ` : ''}

                                ${isAdminActive ? `
                                    <button type="button" onclick="deleteCommentByAdmin(${Number(c.id)})" class="inline-flex items-center gap-1 font-semibold text-rose-500 hover:text-rose-700 transition cursor-pointer ml-auto">
                                        <span>🗑️</span>
                                        <span>Hapus</span>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCommentsList() {
            const listEl = document.getElementById('comments-list');
            const badgeEl = document.getElementById('comment-count-badge');
            if (!listEl) return;

            if (badgeEl) badgeEl.textContent = String(cachedComments.length);

            if (!cachedComments.length) {
                listEl.innerHTML = `
                    <div class="text-center py-8 px-4 rounded-2xl bg-white/70 border border-dashed border-slate-200">
                        <div class="text-2xl mb-1.5">🧪</div>
                        <p class="text-xs sm:text-sm font-bold text-slate-700 mb-0.5">Belum ada tanggapan di artikel ini</p>
                        <p class="text-xs text-slate-500">Jadilah siswa pertama yang menjawab pertanyaan Uji Nalar atau memulai diskusi ilmiah!</p>
                    </div>
                `;
                return;
            }

            const isAdminActive = Boolean(localStorage.getItem('kimia_admin_key'));
            const parents = cachedComments.filter(c => !c.parent_id);
            const repliesByParent = {};
            cachedComments.filter(c => c.parent_id).forEach(r => {
                if (!repliesByParent[r.parent_id]) repliesByParent[r.parent_id] = [];
                repliesByParent[r.parent_id].push(r);
            });

            // Urutkan komentar utama dari yang terbaru di atas, sedangkan balasan urut kronologis
            const sortedParents = [...parents].sort((a, b) => Number(b.created_at) - Number(a.created_at));

            listEl.innerHTML = sortedParents.map(parent => {
                const childReplies = (repliesByParent[parent.id] || []).sort((a, b) => Number(a.created_at) - Number(b.created_at));
                const repliesHtml = childReplies.map(reply => renderSingleCommentItem(reply, true, isAdminActive)).join('');
                return `
                    <div class="p-4 sm:p-5 rounded-2xl bg-white border border-slate-200/80 shadow-2xs">
                        ${renderSingleCommentItem(parent, false, isAdminActive).replace(/^\s*<div class="p-4 sm:p-5 rounded-2xl bg-white border border-slate-200\/80 shadow-2xs">([\s\S]*)<\/div>\s*$/, '$1')}
                        ${repliesHtml ? `<div class="mt-3 space-y-2.5">${repliesHtml}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function setReplyComment(parentId, authorName) {
            currentReplyParentId = parentId;
            currentReplyParentName = authorName;
            const indicator = document.getElementById('reply-indicator');
            const textEl = document.getElementById('reply-indicator-text');
            if (indicator && textEl) {
                textEl.textContent = 'Membalas tanggapan @' + authorName;
                indicator.classList.remove('hidden');
            }
            const textarea = document.getElementById('comment-content');
            if (textarea) {
                textarea.focus();
                textarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function cancelReplyComment() {
            currentReplyParentId = null;
            currentReplyParentName = '';
            const indicator = document.getElementById('reply-indicator');
            if (indicator) indicator.classList.add('hidden');
        }

        async function submitArticleComment(event) {
            event.preventDefault();
            const nameEl = document.getElementById('comment-name');
            const schoolEl = document.getElementById('comment-school');
            const contentEl = document.getElementById('comment-content');
            const submitBtn = document.getElementById('comment-submit-btn');

            const authorName = (nameEl?.value || '').trim();
            const schoolName = (schoolEl?.value || '').trim();
            const content = (contentEl?.value || '').trim();

            if (authorName.length < 2) {
                showCommentAlert('Nama lengkap minimal 2 karakter.');
                return;
            }
            if (content.length < 3) {
                showCommentAlert('Tanggapan minimal 3 karakter.');
                return;
            }

            const filterErr = hasClientProfanityOrLink(authorName + ' ' + schoolName + ' ' + content);
            if (filterErr) {
                showCommentAlert(filterErr);
                return;
            }

            // Simpan nama & sekolah ke localStorage agar memudahkan diskusi berikutnya
            localStorage.setItem('kimia_comment_name', authorName);
            localStorage.setItem('kimia_comment_school', schoolName);

            const adminKey = localStorage.getItem('kimia_admin_key') || '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Mengirim...</span>';
            }

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (adminKey) headers['X-Admin-Key'] = adminKey;

                const res = await fetch(COMMENTS_API_BASE + '/comments/' + encodeURIComponent(currentArticleSlug), {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({
                        authorName,
                        schoolName,
                        content,
                        parentId: currentReplyParentId,
                        deviceId: getDeviceId()
                    })
                });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    showCommentAlert(data.error || 'Gagal mengirim tanggapan.');
                } else {
                    cachedComments.push(data.comment);
                    saveLocalFallbackComments(currentArticleSlug, cachedComments);
                    if (contentEl) contentEl.value = '';
                    const charInfo = document.getElementById('comment-char-info');
                    if (charInfo) charInfo.textContent = 'Maks. 1000 karakter';
                    cancelReplyComment();
                    renderCommentsList();
                    showCommentAlert('Tanggapan ilmiahmu berhasil dikirim!', false);
                }
            } catch (err) {
                // Fallback simpan lokal jika offline
                const fallbackComment = {
                    id: Date.now(),
                    article_slug: currentArticleSlug,
                    parent_id: currentReplyParentId,
                    author_name: authorName,
                    school_name: schoolName,
                    content,
                    is_admin: adminKey ? 1 : 0,
                    likes: 0,
                    created_at: Date.now()
                };
                cachedComments.push(fallbackComment);
                saveLocalFallbackComments(currentArticleSlug, cachedComments);
                if (contentEl) contentEl.value = '';
                cancelReplyComment();
                renderCommentsList();
                showCommentAlert('Tanggapan berhasil ditampilkan!', false);
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>🚀 Kirim Tanggapan</span>';
                }
            }
        }

        async function toggleLikeComment(commentId) {
            try {
                const res = await fetch(COMMENTS_API_BASE + '/comments/like', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        commentId,
                        deviceId: getDeviceId()
                    })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    const target = cachedComments.find(c => Number(c.id) === Number(commentId));
                    if (target) target.likes = data.likes;
                    if (data.liked) {
                        if (!likedCommentIds.includes(commentId)) likedCommentIds.push(commentId);
                    } else {
                        likedCommentIds = likedCommentIds.filter(id => Number(id) !== Number(commentId));
                    }
                    renderCommentsList();
                }
            } catch (e) {
                // Fallback lokal
                const target = cachedComments.find(c => Number(c.id) === Number(commentId));
                if (target) {
                    if (likedCommentIds.includes(commentId)) {
                        likedCommentIds = likedCommentIds.filter(id => Number(id) !== Number(commentId));
                        target.likes = Math.max(0, Number(target.likes || 0) - 1);
                    } else {
                        likedCommentIds.push(commentId);
                        target.likes = Number(target.likes || 0) + 1;
                    }
                    saveLocalFallbackComments(currentArticleSlug, cachedComments);
                    renderCommentsList();
                }
            }
        }

        async function deleteCommentByAdmin(commentId) {
            const adminKey = localStorage.getItem('kimia_admin_key');
            if (!adminKey) return;
            if (!window.confirm('Hapus komentar ini beserta balasannya secara permanen?')) return;

            try {
                const res = await fetch(COMMENTS_API_BASE + '/admin/comments/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Key': adminKey
                    },
                    body: JSON.stringify({ commentId })
                });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    window.alert(data.error || 'Kunci Admin tidak valid atau gagal menghapus komentar.');
                    return;
                }
                cachedComments = cachedComments.filter(c => Number(c.id) !== Number(commentId) && Number(c.parent_id) !== Number(commentId));
                saveLocalFallbackComments(currentArticleSlug, cachedComments);
                renderCommentsList();
            } catch (e) {
                cachedComments = cachedComments.filter(c => Number(c.id) !== Number(commentId) && Number(c.parent_id) !== Number(commentId));
                saveLocalFallbackComments(currentArticleSlug, cachedComments);
                renderCommentsList();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadArtikel();
        });
    </script>
</body>
</html>
