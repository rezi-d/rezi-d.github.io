<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Membaca Artikel - Sains Populer | KimiaInteraktif</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen antialiased">

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex-grow w-full">
        <!-- BREADCRUMBS -->
        <nav class="flex items-center gap-2 text-xs text-slate-500 mb-6 flex-wrap">
            <a href="/index.html" class="hover:text-teal-600 transition">Beranda</a>
            <span>/</span>
            <a href="/sains-populer/index.html" class="hover:text-teal-600 transition">Sains Populer</a>
            <span>/</span>
            <span id="breadcrumb-title" class="text-slate-800 font-semibold truncate max-w-[200px] sm:max-w-md">Artikel</span>
        </nav>

        <!-- CONTAINER ARTIKEL UTAMA -->
        <article id="article-container" class="bg-white rounded-3xl border border-black/[0.06] shadow-[0_8px_32px_rgba(0,0,0,0.03)] p-6 sm:p-10 md:p-12 mb-12">
            <!-- Article Header & Content injected here -->
        </article>

        <!-- NOT FOUND STATE -->
        <div id="not-found-container" class="hidden text-center py-16 bg-white rounded-3xl border border-dashed border-slate-200">
            <span class="text-5xl">📄</span>
            <h2 class="text-xl font-bold text-slate-900 mt-4">Artikel Tidak Ditemukan</h2>
            <p class="text-sm text-slate-500 mt-2 max-w-md mx-auto">
                Maaf, artikel yang kamu cari tidak tersedia atau tautan yang kamu buka salah.
            </p>
            <a href="/sains-populer/index.html" class="mt-6 inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-teal-600 text-white text-xs font-bold hover:bg-teal-700 transition">
                <span>&larr;</span>
                <span>Kembali ke Sains Populer</span>
            </a>
        </div>

        <!-- REKOMENDASI ARTIKEL LAINNYA -->
        <div id="rekomendasi-container" class="mt-12 pt-8 border-t border-slate-200">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Ulasan Sains Populer Lainnya</h3>
                    <p class="text-xs text-slate-500 mt-0.5">Jelajahi topik sains dan teknologi menarik lainnya</p>
                </div>
                <a href="/sains-populer/index.html" class="text-xs font-bold text-teal-600 hover:text-teal-700 flex items-center gap-1">
                    <span>Lihat Semua</span>
                    <span>&rsaquo;</span>
                </a>
            </div>
            <div id="rekomendasi-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-semibold flex items-center gap-2">
            <span>✅</span>
            <span id="toast-text">Tautan artikel berhasil disalin!</span>
        </div>
    </div>

    <!-- Footer & SPU Placeholders -->
    <div id="footer-placeholder"></div>
    <div id="spu-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/curriculum.js"></script>
    <script src="/js/spu.js"></script>
    <script src="/js/include.js"></script>
    <script src="/sains-populer/data/artikel.js"></script>
    <script>
        function tampilkanToast(pesan) {
            const toast = document.getElementById('toast');
            const text = document.getElementById('toast-text');
            text.innerText = pesan;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function salinTautan() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                tampilkanToast('Tautan artikel berhasil disalin!');
            }).catch(() => {
                tampilkanToast('Gagal menyalin tautan.');
            });
        }

        function loadArtikel() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('id');

            const container = document.getElementById('article-container');
            const notFound = document.getElementById('not-found-container');
            const breadcrumbTitle = document.getElementById('breadcrumb-title');

            if (!slug || typeof DAFTAR_ARTIKEL_SAINS === 'undefined') {
                container.classList.add('hidden');
                notFound.classList.remove('hidden');
                return;
            }

            const art = DAFTAR_ARTIKEL_SAINS.find(item => item.slug === slug || item.id === slug);

            if (!art) {
                container.classList.add('hidden');
                notFound.classList.remove('hidden');
                return;
            }

            // Update title
            document.title = `${art.title} - Sains Populer | KimiaInteraktif`;
            breadcrumbTitle.innerText = art.title;

            // Render Kaitan Materi SMA
            const kaitanMateriHtml = (art.kaitanMateri || []).map(k => `
                <div class="p-4 rounded-2xl bg-white border border-teal-100/80 shadow-2xs hover:shadow-sm transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[11px] font-bold text-teal-800 bg-teal-50 px-2 py-0.5 rounded-full border border-teal-200">
                                ${k.kelas}
                            </span>
                            <span class="text-xs text-slate-400">Kimia SMA</span>
                        </div>
                        <h5 class="text-sm font-bold text-slate-900 mt-1 mb-1">${k.bab}</h5>
                        <p class="text-xs text-slate-600 leading-relaxed mb-3">${k.desc}</p>
                    </div>
                    <div>
                        <a href="${k.url}" class="inline-flex items-center gap-1.5 text-xs font-bold text-teal-600 hover:text-teal-700">
                            <span>Buka Bab Materi</span>
                            <span class="text-sm leading-none">&rarr;</span>
                        </a>
                    </div>
                </div>
            `).join('');

            // Render Header & Body
            container.innerHTML = `
                <!-- Top Meta Bar -->
                <div class="flex flex-wrap items-center justify-between gap-3 pb-6 border-b border-slate-100 mb-6">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full ${
                            art.categoryColor === 'amber' ? 'bg-amber-100 text-amber-900' :
                            art.categoryColor === 'teal' ? 'bg-teal-100 text-teal-900' :
                            'bg-indigo-100 text-indigo-900'
                        }">
                            ${art.category}
                        </span>
                        <span class="text-xs text-slate-400">•</span>
                        <span class="text-xs text-slate-500 flex items-center gap-1">
                            <span>⏱️</span> ${art.readTime}
                        </span>
                    </div>

                    <div class="flex items-center gap-2">
                        <button type="button" onclick="salinTautan()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition cursor-pointer">
                            <span>🔗</span>
                            <span>Salin Tautan</span>
                        </button>
                        <a href="https://wa.me/?text=${encodeURIComponent(art.title + ' - Baca di: ' + window.location.href)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold border border-emerald-200 transition">
                            <span>💬</span>
                            <span>Bagikan</span>
                        </a>
                    </div>
                </div>

                <!-- Judul & Subjudul -->
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">
                    ${art.title}
                </h1>
                <p class="text-sm sm:text-base text-slate-500 font-normal leading-relaxed mb-6">
                    ${art.subtitle}
                </p>

                <!-- Penulis & Tanggal -->
                <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-slate-50 border border-slate-100 mb-8 text-xs text-slate-600">
                    <span class="w-8 h-8 rounded-full bg-teal-600 text-white flex items-center justify-center font-bold text-sm select-none">
                        🧪
                    </span>
                    <div>
                        <p class="font-bold text-slate-800">${art.author}</p>
                        <p class="text-[11px] text-slate-400">Ditinjau secara ilmiah • Dipublikasikan ${art.publishDate}</p>
                    </div>
                </div>

                <!-- Konten Utama Artikel -->
                <div class="text-slate-700 leading-relaxed space-y-4 text-sm sm:text-base">
                    ${art.contentHtml}
                </div>

                <!-- TAHUKAH KAMU BOX -->
                ${art.tahukahKamu ? `
                    <div class="mt-10 p-6 rounded-3xl bg-gradient-to-br from-amber-50/80 via-orange-50/40 to-yellow-50/80 border border-amber-200/80">
                        <div class="flex items-start gap-3.5">
                            <span class="text-3xl select-none">💡</span>
                            <div>
                                <h4 class="font-bold text-amber-950 text-base mb-1.5">Tahukah Kamu?</h4>
                                <p class="text-xs sm:text-sm text-amber-900/90 leading-relaxed">
                                    ${art.tahukahKamu}
                                </p>
                            </div>
                        </div>
                    </div>
                ` : ''}

                <!-- KAITAN MATERI KURIKULUM SMA BOX -->
                <div class="mt-10 p-6 sm:p-8 rounded-3xl bg-gradient-to-br from-teal-50/70 via-slate-50 to-emerald-50/60 border border-teal-200/70">
                    <div class="flex items-center gap-2.5 mb-2">
                        <span class="text-2xl select-none">🧪</span>
                        <h4 class="font-bold text-slate-900 text-base sm:text-lg">Kacamata Kimia SMA: Hubungkan dengan Pelajaranmu!</h4>
                    </div>
                    <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-6">
                        Konsep sains dalam artikel ini berkaitan langsung dengan materi yang kamu pelajari di sekolah. Klik untuk mendalami rumusan dan latihan soalnya:
                    </p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                        ${kaitanMateriHtml}
                    </div>
                </div>

                <!-- RUANG DISKUSI & UJI NALAR -->
                ${art.diskusi ? `
                    <div class="mt-8 p-6 rounded-3xl bg-indigo-50/60 border border-indigo-100">
                        <div class="flex items-start gap-3">
                            <span class="text-2xl select-none">🤔</span>
                            <div>
                                <h4 class="font-bold text-indigo-950 text-base mb-1.5">Ruang Diskusi &amp; Uji Nalar Sains</h4>
                                <p class="text-xs sm:text-sm text-indigo-900/90 leading-relaxed">
                                    ${art.diskusi}
                                </p>
                            </div>
                        </div>
                    </div>
                ` : ''}

                <!-- TOMBOL KEMBALI DI BAWAH -->
                <div class="mt-12 pt-6 border-t border-slate-100 flex items-center justify-between">
                    <a href="/sains-populer/index.html" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">
                        <span>&larr;</span>
                        <span>Daftar Artikel Sains Populer</span>
                    </a>
                    <button type="button" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="inline-flex items-center gap-1 text-xs font-semibold text-slate-400 hover:text-slate-700 transition cursor-pointer">
                        <span>Ke Atas</span>
                        <span>&uarr;</span>
                    </button>
                </div>
            `;

            // Render Rekomendasi Artikel Lain
            const rekomendasi = DAFTAR_ARTIKEL_SAINS.filter(item => item.slug !== art.slug);
            const rekGrid = document.getElementById('rekomendasi-grid');
            if (rekGrid && rekomendasi.length > 0) {
                rekGrid.innerHTML = rekomendasi.slice(0, 2).map(r => `
                    <a href="/sains-populer/baca.html?id=${r.slug}" class="block p-5 rounded-2xl bg-white border border-slate-200/80 shadow-2xs hover:shadow-md hover:border-teal-300 transition group">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold px-2 py-0.5 rounded-full ${
                                r.categoryColor === 'amber' ? 'bg-amber-100 text-amber-800' :
                                r.categoryColor === 'teal' ? 'bg-teal-100 text-teal-800' :
                                'bg-indigo-100 text-indigo-800'
                            }">
                                ${r.category}
                            </span>
                            <span class="text-[11px] text-slate-400">${r.readTime}</span>
                        </div>
                        <h4 class="text-sm font-bold text-slate-900 group-hover:text-teal-600 transition line-clamp-2 mb-1.5">
                            ${r.title}
                        </h4>
                        <p class="text-xs text-slate-500 line-clamp-2">
                            ${r.summary}
                        </p>
                    </a>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadArtikel();
        });
    </script>
</body>
</html>
