name: Update Mingguan Sains Populer

on:
  schedule:
    # Berjalan setiap hari Senin pukul 00:00 UTC (Pukul 07:00 WIB pagi)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Memungkinkan admin memicu update secara manual kapan saja dari tab Actions di GitHub

permissions:
  contents: write

jobs:
  generate-articles:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🤖 Jalankan Generator Sains Populer (Gemini AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-sains-populer.js

      - name: 🚀 Commit & Push Artikel Baru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sains-populer/data/artikel.js
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan artikel baru."
          else
            git commit -m "chore(sains-populer): auto-update 2 artikel warta sains mingguan via gemini [skip ci]"
            git push origin main
            echo "✅ Artikel baru berhasil dipush ke website!"
          fi
