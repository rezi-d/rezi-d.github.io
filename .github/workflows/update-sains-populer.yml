name: Update Mingguan Sains Populer

on:
  schedule:
    # Berjalan setiap hari Minggu pukul 20:25 UTC (Pukul 03:25 WIB dini hari)
    # Jadwal ini dipilih karena:
    # 1. Antrean global runner GitHub Actions berada pada titik paling lengang.
    # 2. Trafik pengunjung web di Indonesia berada di zona terendah (dead-zone).
    # 3. Menit acak :25 menghindari kemacetan cron pada menit :00 / :30.
    # 4. Artikel baru siap terbit segar saat pembaca membuka web di Minggu pagi atau Senin pagi.
    - cron: '25 20 * * 6'
  workflow_dispatch:
    # Memungkinkan admin memicu update secara manual kapan saja dari tab Actions di GitHub

permissions:
  contents: write

jobs:
  generate-articles:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🤖 Jalankan Generator Sains Populer (Gemini AI Multi-Disiplin)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/generate-sains-populer.js

      - name: 🚀 Commit & Push Artikel Baru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sains-populer/data/artikel.js
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan artikel baru."
          else
            git commit -m "chore(sains-populer): auto-update warta sains mingguan multi-disiplin via gemini [skip ci]"
            git push origin main
            echo "✅ Artikel baru multi-disiplin berhasil dipush ke website!"
          fi
