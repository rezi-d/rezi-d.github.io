<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelas XI - KimiaInteraktif</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen" data-kelas="11">

    <!-- HEADER (dimuat otomatis) -->
    <div id="header-placeholder"></div>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <!-- Badge & Judul diisi otomatis oleh render-hub.js berdasarkan data-kelas di atas -->
        <span id="kelas-badge" class="inline-block px-3 py-1 bg-teal-100 text-teal-800 rounded-full text-xs font-semibold uppercase mb-3">
            Kelas XI
        </span>
        <h1 id="kelas-judul" class="text-3xl font-bold text-slate-900 mb-8 tracking-tight">
            Materi Kimia Kelas XI
        </h1>

        <!-- Kartu bab dirender otomatis oleh js/render-hub.js berdasarkan js/curriculum.js -->
        <div id="bab-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
    </div>

    <!-- FOOTER (dimuat otomatis) -->
    <div id="footer-placeholder"></div>

    <!-- SPU MODAL + TOMBOL (dimuat otomatis) -->
    <div id="spu-placeholder"></div>

    <!-- SCRIPT BERSAMA -->
    <script src="/js/curriculum.js"></script>
    <script src="/js/render-hub.js"></script>
    <script src="/js/spu.js"></script>
    <script src="/js/include.js"></script>
