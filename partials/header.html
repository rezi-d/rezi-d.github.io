<!-- HEADER / NAVIGASI (Gaya Apple Frosted Glass) -->
<header class="bg-white/80 backdrop-blur-md supports-[backdrop-filter]:bg-white/75 border-b border-black/[0.06] sticky top-0 z-50 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between gap-3">
        <!-- BRAND LOGO -->
        <div class="flex items-center space-x-2.5 shrink-0">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 border border-black/[0.04] text-lg select-none">🧪</span>
            <a href="/index.html" class="text-base sm:text-lg font-bold text-slate-900 hover:text-teal-600 tracking-tight transition-colors">
                Kimia<span class="text-teal-600">Interaktif</span>
            </a>
        </div>

        <!-- NAV LINKS -->
        <nav class="hidden md:flex items-center gap-7 text-[13px] font-medium text-slate-600 shrink-0">
            <a href="/index.html" class="hover:text-slate-950 transition-colors">Beranda</a>

            <!-- DROPDOWN MATERI: Kelas X / XI / XII -->
            <div class="relative group">
                <button class="hover:text-slate-950 transition-colors flex items-center gap-1 py-2 cursor-pointer">
                    Materi <span class="text-[8px] opacity-60 mt-0.5">&#9660;</span>
                </button>
                <div class="absolute left-0 top-full hidden group-hover:block z-50 pt-1">
                    <div class="bg-white/95 backdrop-blur-xl border border-black/[0.08] rounded-2xl shadow-[0_12px_36px_rgba(0,0,0,0.08)] p-1.5 w-44">
                        <a href="/kelas-10/index.html" class="flex items-center justify-between px-3 py-2 text-xs font-medium text-slate-700 hover:text-slate-950 hover:bg-slate-100/80 rounded-xl transition-all">
                            <span>Kelas X</span>
                            <span class="text-[10px] text-slate-400 font-mono">&rsaquo;</span>
                        </a>
                        <a href="/kelas-11/index.html" class="flex items-center justify-between px-3 py-2 text-xs font-medium text-slate-700 hover:text-slate-950 hover:bg-slate-100/80 rounded-xl transition-all">
                            <span>Kelas XI</span>
                            <span class="text-[10px] text-slate-400 font-mono">&rsaquo;</span>
                        </a>
                        <a href="/kelas-12/index.html" class="flex items-center justify-between px-3 py-2 text-xs font-medium text-slate-700 hover:text-slate-950 hover:bg-slate-100/80 rounded-xl transition-all">
                            <span>Kelas XII</span>
                            <span class="text-[10px] text-slate-400 font-mono">&rsaquo;</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- SLOT MODUL LAIN (TKA, ANBK, dst) — diisi otomatis oleh js/include.js dari js/curriculum.js -->
            <span id="modul-lain-nav" class="contents"></span>

            <a href="/tentang.html" class="hover:text-slate-950 transition-colors">Tentang</a>
        </nav>

        <!-- KOLOM PENCARIAN MATERI OTOMATIS (Apple Pill Search Bar) -->
        <div class="relative flex-1 max-w-xs sm:max-w-sm">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-xs pointer-events-none">🔍</span>
                <input type="text" id="global-search-input" autocomplete="off"
                       placeholder="Cari materi, rumus, simulator..."
                       class="w-full pl-9 pr-3.5 py-1.5 sm:py-2 bg-black/[0.04] hover:bg-black/[0.06] focus:bg-white border border-transparent focus:border-teal-500/50 focus:ring-2 focus:ring-teal-500/10 rounded-full text-xs sm:text-[13px] text-slate-900 placeholder:text-slate-400 focus:outline-none transition-all">
            </div>
            <div id="global-search-results" class="hidden absolute right-0 left-0 sm:left-auto sm:w-96 mt-2 bg-white/95 backdrop-blur-xl border border-black/[0.08] rounded-2xl shadow-[0_16px_40px_rgba(0,0,0,0.12)] max-h-80 overflow-y-auto z-50 divide-y divide-slate-100 p-1.5"></div>
        </div>

        <div class="hidden lg:flex items-center space-x-3 shrink-0">
            <a href="/index.html" id="btn-kembali-beranda" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium text-slate-600 hover:text-slate-950 hover:bg-slate-100/80 transition-all">
                <span>&larr;</span> <span>Beranda</span>
            </a>
        </div>
    </div>
</header>
