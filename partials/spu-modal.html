<!-- TOMBOL MELAYANG (Gaya Apple Floating Glass Pill) -->
<button id="btnOpenSpu" onclick="toggleSpuModal(true)"
        class="fixed bottom-4 right-4 bg-slate-900/90 hover:bg-black text-white font-medium px-4 py-2 rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.18)] border border-white/20 backdrop-blur-md flex items-center gap-2 transition-all transform active:scale-95 z-40 cursor-pointer">
    <span class="text-base leading-none">🧪</span>
    <span class="text-xs font-semibold tracking-wide">Tabel Periodik (Ar)</span>
</button>

<!-- MODAL POP-UP SISTEM PERIODIK UNSUR (118 UNSUR) -->
<div id="spuModal" class="fixed inset-0 bg-black/40 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 sm:p-6">
    <div class="bg-white w-full max-w-5xl max-h-[90vh] rounded-3xl shadow-[0_24px_64px_rgba(0,0,0,0.2)] flex flex-col overflow-hidden border border-black/[0.08]">

        <!-- Header Modal & Input Pencarian -->
        <div class="p-4 sm:p-6 bg-slate-900 text-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h3 class="text-lg font-bold flex items-center gap-2">
                    🧪 Tabel Periodik &amp; Massa Atom Relatif (Ar)
                </h3>
                <p class="text-xs text-slate-400 mt-0.5">Menampilkan 118 Unsur Kimia Lengkap &bull; Kurikulum SMA</p>
            </div>

            <div class="flex items-center gap-3 w-full sm:w-auto">
                <input type="text" id="searchUnsur" onkeyup="filterUnsur()" placeholder="Cari nama, lambang, atau Ar..."
                       class="px-4 py-1.5 rounded-full bg-slate-800 text-white text-xs sm:text-sm border border-slate-700 focus:outline-none focus:border-teal-400 w-full sm:w-64 transition-all">
                <button onclick="toggleSpuModal(false)" class="text-slate-400 hover:text-white text-2xl font-bold px-2 cursor-pointer leading-none">&times;</button>
            </div>
        </div>

        <!-- Isi Modal: Kalkulator Mr + Legenda Kategori + Panel Detail + Grid Unsur -->
        <div class="p-4 sm:p-6 overflow-y-auto flex-grow bg-slate-50">
            <!-- Kalkulator Massa Molekul Relatif (Mr) Otomatis -->
            <div class="bg-gradient-to-r from-teal-50 to-indigo-50 border border-teal-200 rounded-xl p-3.5 mb-4 shadow-2xs">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
                    <div>
                        <h4 class="text-xs font-bold uppercase tracking-wider text-teal-900 flex items-center gap-1.5">
                            🧮 Kalkulator Massa Molar (M<sub>r</sub>) Otomatis
                        </h4>
                        <p class="text-[11px] text-slate-600 mt-0.5">Ketik rumus kimia (perhatikan huruf besar/kecil, misal: <code class="bg-white px-1 rounded border border-slate-200">H2SO4</code>, <code class="bg-white px-1 rounded border border-slate-200">Ca(OH)2</code>, <code class="bg-white px-1 rounded border border-slate-200">CuSO4.5H2O</code>)</p>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <input type="text" id="inputRumusMr" oninput="hitungMrOtomatis()" placeholder="Contoh: Ca(OH)2"
                               class="px-3 py-1.5 rounded-lg bg-white text-slate-800 font-mono text-sm border border-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-500 w-full sm:w-48">
                        <button type="button" onclick="document.getElementById('inputRumusMr').value='CuSO4.5H2O';hitungMrOtomatis()" class="text-[11px] bg-white hover:bg-teal-100 text-teal-700 border border-teal-200 px-2.5 py-1.5 rounded-lg font-semibold shrink-0 transition">Contoh</button>
                    </div>
                </div>
                <div id="hasilHitungMr" class="hidden mt-2.5 pt-2.5 border-t border-teal-200/70 text-xs"></div>
            </div>

            <div class="flex items-center justify-between mb-3">
                <div id="legendaUnsur" class="flex flex-wrap gap-x-3 gap-y-1.5"></div>
                <span class="hidden sm:inline text-[11px] text-slate-400 italic shrink-0 ml-3">👆 Klik unsur untuk detail</span>
            </div>
            <hr class="border-slate-200 mb-4">

            <div id="detailUnsur" class="hidden mb-4"></div>

            <div id="gridUnsur" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2.5">
                <!-- Data 118 Unsur dirender otomatis oleh js/spu.js -->
            </div>
        </div>

        <!-- Footer Modal -->
        <div class="p-4 bg-white border-t border-slate-200 flex justify-between items-center text-xs text-slate-500">
            <span>Tekan tombol <kbd class="px-1.5 py-0.5 bg-slate-100 border border-slate-300 rounded text-slate-700">ESC</kbd> untuk menutup</span>
            <button onclick="toggleSpuModal(false)" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold px-4 py-1.5 rounded-lg transition">
                Tutup
            </button>
        </div>
    </div>
</div>
