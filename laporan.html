<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelaporan Tugas Susulan — AjarKita</title>
    <meta name="description" content="Formulir resmi pelaporan tugas susulan Google Classroom SMA AjarKita. Siswa merekap tugas fisik yang telah diserahkan secara manual ke guru mapel.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://kimia.ajarkita.my.id/laporan.html">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              apple: {
                blue: '#0071e3',
                'blue-hover': '#0077ed',
                text: '#1d1d1f',
                muted: '#86868b',
                surface: '#f5f5f7',
                border: 'rgba(0, 0, 0, 0.08)',
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <!-- NAVBAR MINIMALIS -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-slate-900 font-bold text-lg hover:opacity-80 transition">
                <span>🎓</span>
                <span>AjarKita</span>
            </a>
            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200">
                Layanan Pelaporan Siswa
            </span>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-xl mx-auto px-4 py-8 sm:py-12 flex-1 w-full flex flex-col items-center justify-center">
        <!-- Status Container (Dinamis) -->
        <div id="laporan-status-container" class="w-full bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/80 shadow-[0_12px_40px_rgba(0,0,0,0.06)] text-center">
            <div class="animate-pulse flex flex-col items-center">
                <div class="w-12 h-12 bg-slate-200 rounded-full mb-4"></div>
                <div class="h-6 bg-slate-200 rounded w-3/4 mb-3"></div>
                <div class="h-4 bg-slate-200 rounded w-1/2"></div>
            </div>
            <p class="text-xs text-slate-400 mt-4">Memeriksa status periode pelaporan...</p>
        </div>
    </main>

    <!-- FOOTER SEDERHANA -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 AjarKita. Platform Pembelajaran Kimia &amp; Pelaporan Tugas Terpadu.</p>
    </footer>

    <!-- MODAL DEPENDENCY & RUNNER -->
    <script src="/js/task-modal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('laporan-status-container');
            
            try {
                const TASK_API_BASE = window.TASK_API_BASE || 'https://kimia-snbt-api.kimia-ajarkita.workers.dev';
                const res = await fetch(`${TASK_API_BASE}/api/task/public/status`, {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await res.json();

                if (!res.ok || !data.ok || !data.isOpen || !data.period) {
                    // Periode Sedang Ditutup
                    container.innerHTML = `
                        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-3xl">
                            🔒
                        </div>
                        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mb-2">
                            Pelaporan Sedang Ditutup
                        </h1>
                        <p class="text-sm text-slate-600 max-w-md mx-auto mb-6 leading-relaxed">
                            Saat ini belum ada periode pelaporan tugas susulan yang aktif. Silakan hubungi guru mata pelajaran atau wali kelas Anda untuk informasi jadwal pembukaan pelaporan berikutnya.
                        </p>
                        <a href="/" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition active:scale-98">
                            &larr; Kembali ke Beranda
                        </a>
                    `;
                    return;
                }

                const period = data.period;

                // Periode Aktif Terbuka
                container.innerHTML = `
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-3xl">
                        📋
                    </div>
                    <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 mb-3">
                        Periode Aktif
                    </span>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 mb-2">
                        ${escapeHtml(period.name)}
                    </h1>
                    <p class="text-sm text-slate-600 max-w-md mx-auto mb-6 leading-relaxed">
                        Formulir pelaporan tugas susulan Google Classroom telah dibuka. Klik tombol di bawah untuk memasukkan kode akses dan mulai mencatat tugas Anda.
                    </p>
                    <button type="button" id="btn-open-laporan-modal" class="inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-base font-bold shadow-lg shadow-blue-500/20 transition active:scale-98 cursor-pointer w-full sm:w-auto">
                        <span>📝</span>
                        <span>Buka Formulir Pelaporan Sekarang</span>
                    </button>
                    <div class="mt-6 pt-6 border-t border-slate-100 flex items-center justify-center gap-2 text-xs text-slate-400">
                        <span>🔒</span>
                        <span>Data tersimpan aman &amp; otomatis dihapus setelah masa simpan</span>
                    </div>
                `;

                const openBtn = document.getElementById('btn-open-laporan-modal');
                openBtn.addEventListener('click', () => {
                    if (window.TaskReportingModal && typeof window.TaskReportingModal.open === 'function') {
                        window.TaskReportingModal.open(period, openBtn);
                    }
                });

                // Buka otomatis secara instan untuk kemudahan siswa
                if (window.TaskReportingModal && typeof window.TaskReportingModal.open === 'function') {
                    window.TaskReportingModal.open(period, openBtn);
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-3xl">
                        ⚠️
                    </div>
                    <h1 class="text-xl font-bold text-slate-900 mb-2">
                        Gagal Memuat Status
                    </h1>
                    <p class="text-sm text-slate-600 mb-6">
                        Terjadi gangguan saat menghubungi server. Pastikan perangkat Anda terhubung ke internet.
                    </p>
                    <button onclick="location.reload()" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800 transition">
                        Coba Lagi
                    </button>
                `;
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
